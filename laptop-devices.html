<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار اللابتوب</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .title {
            padding: 40px 20px;
        }

        .product {
            background: white;
            width: 300px;
            max-width: 85%;
            margin: 20px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .laptop {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .price {
            color: #2563eb;
            font-weight: bold;
            margin: 15px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <header>
        <div class="logo">
            Bazaro
        </div>
    </header>

    <div class="title">

        <h1>أجهزة اللابتوب فقط</h1>

        <p>الأجهزة المتوفرة للبيع</p>

    </div>

    <div class="product">

        <div class="laptop">
            صورة المنتج
        </div>
        </div>

        <h2>
            مثال جهاز لابتوب
        </h2>

        <div class="price">
            السعر سيضاف لاحقًا
        </div>

        <p>
            اسم المتجر
        </p>

    </div>

    <a href="laptops.html" class="back">
        ← العودة إلى اللابتوبات
    </a>
    
</body>

</html>
