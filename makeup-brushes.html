<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>فرش وأدوات المكياج - Bazaro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .page-title {
            text-align: center;
            padding: 50px 15px 30px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .page-title p {
            color: #666;
            font-size: 17px;
        }

        .products {

            max-width: 900px;

            margin: auto;

            padding: 20px;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }

        .product-card {

            background: white;

            border-radius: 16px;

            padding: 35px 20px;

            text-align: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .product-icon {

            font-size: 65px;

            margin-bottom: 20px;
        }

        .product-card h2 {

            font-size: 21px;

            margin-bottom: 10px;
        }

        .product-card p {

            color: #666;

            font-size: 15px;

            line-height: 1.6;
        }

        footer {

            margin-top: 50px;

            background: #222;

            color: white;

            text-align: center;

            padding: 25px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 24px;
            }

            .page-title {
                padding: 40px 15px 20px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .page-title p {
                font-size: 15px;
                line-height: 1.6;
            }

            .products {

                grid-template-columns: 1fr;

                padding: 15px;

                gap: 15px;
            }

            .product-card {

                padding: 30px 15px;
            }

            .product-icon {

                font-size: 55px;
            }

            .product-card h2 {

                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Bazaro
    </div>

    <a href="makeup.html"
       class="back">

        ← المكياج

    </a>

</header>


<section class="page-title">

    <h1>
        🖌️ فرش وأدوات المكياج
    </h1>

    <p>
        منتجات فرش وأدوات المكياج
    </p>

</section>


<section class="products">

    <!-- المنتجات ستضاف هنا لاحقًا -->

</section>


<footer>

    <p>
        © 2026 Bazaro - جميع الحقوق محفوظة
    </p>

</footer>


</body>

</html>
