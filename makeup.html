<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bazaro - المكياج</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }


        /* الشريط العلوي */

        .top-nav {

            background: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            direction: ltr;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .top-nav .logo {

            color: #2875d0;

            font-size: 32px;

            font-weight: bold;

            text-decoration: none;
        }


        .top-nav .home {

            color: #2875d0;

            font-size: 22px;

            font-weight: bold;

            text-decoration: none;
        }


        /* رأس قسم المكياج */

        header {

            background: #ff4f81;

            color: white;

            padding: 20px;

            text-align: center;
        }


        header h1 {

            margin: 0;

            font-size: 28px;
        }


        header p {

            margin: 8px 0 0;

            font-size: 16px;
        }


        /* حالة القسم */

        .status {

            display: inline-block;

            margin-top: 12px;

            padding: 6px 16px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }


        .on {

            background: #dcfce7;

            color: #15803d;
        }


        .off {

            background: #fee2e2;

            color: #b91c1c;
        }


        .error {

            background: #fef3c7;

            color: #92400e;
        }


        /* المحتوى */

        .container {

            padding: 20px;

            max-width: 1000px;

            margin: auto;
        }


        /* الأقسام */

        .categories {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 15px;
        }


        .category {

            background: white;

            border-radius: 15px;

            padding: 25px 15px;

            text-align: center;

            text-decoration: none;

            color: #222;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.1);

            transition: 0.2s;
        }


        .category:hover {

            transform: translateY(-4px);
        }


        .icon {

            font-size: 45px;

            margin-bottom: 10px;
        }


        .category h2 {

            margin: 5px 0;

            font-size: 19px;
        }


        /* الفوتر */

        footer {

            margin-top: 30px;

            text-align: center;

            padding: 20px;

            color: #777;
        }


        /* الموبايل */

        @media (max-width: 600px) {

            .top-nav {

                padding: 15px 18px;
            }


            .top-nav .logo {

                font-size: 26px;
            }


            .top-nav .home {

                font-size: 18px;
            }


            header h1 {

                font-size: 25px;
            }


            header p {

                font-size: 15px;
            }


            .container {

                padding: 15px;
            }


            .categories {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }


            .category {

                padding: 22px 10px;
            }


            .icon {

                font-size: 40px;
            }


            .category h2 {

                font-size: 17px;

                line-height: 1.5;
            }

        }

    </style>

</head>


<body>


    <!-- الشريط العلوي -->

    <div class="top-nav">


        <a href="index.html"
           class="home">

            الرئيسية ←

        </a>


        <a href="index.html"
           class="logo">

            Bazaro

        </a>


    </div>



    <!-- رأس قسم المكياج -->

    <header>


        <h1>
            💄 Bazaro
        </h1>


        <p>
            قسم المكياج
        </p>


        <span id="makeup-status"
              class="status">

            جاري التحميل...

        </span>


    </header>



    <!-- الأقسام -->

    <div class="container">


        <div class="categories">


            <!-- أحمر الشفاه -->

            <a href="makeup-lipstick.html"
               class="category">

                <div class="icon">
                    💄
                </div>

                <h2>
                    أحمر الشفاه
                </h2>

            </a>



            <!-- مكياج العيون -->

            <a href="makeup-eyes.html"
               class="category">

                <div class="icon">
                    👁️
                </div>

                <h2>
                    مكياج العيون
                </h2>

            </a>



            <!-- كريم الأساس والكونسيلر -->

            <a href="makeup-foundation.html"
               class="category">

                <div class="icon">
                    🧴
                </div>

                <h2>
                    كريم الأساس والكونسيلر
                </h2>

            </a>



            <!-- البودرة والبلاشر -->

            <a href="makeup-powder.html"
               class="category">

                <div class="icon">
                    🌸
                </div>

                <h2>
                    البودرة والبلاشر
                </h2>

            </a>



            <!-- فرش وأدوات المكياج -->

            <a href="makeup-brushes.html"
               class="category">

                <div class="icon">
                    🖌️
                </div>

                <h2>
                    فرش وأدوات المكياج
                </h2>

            </a>



            <!-- مكياج الأظافر -->

            <a href="makeup-nails.html"
               class="category">

                <div class="icon">
                    💅
                </div>

                <h2>
                    مكياج الأظافر
                </h2>

            </a>



            <!-- الهايلايتر والكونتور -->

            <a href="makeup-highlighter.html"
               class="category">

                <div class="icon">
                    ✨
                </div>

                <h2>
                    الهايلايتر والكونتور
                </h2>

            </a>



            <!-- مزيلات المكياج -->

            <a href="makeup-removers.html"
               class="category">

                <div class="icon">
                    🧼
                </div>

                <h2>
                    مزيلات المكياج
                </h2>

            </a>


        </div>

    </div>



    <!-- الفوتر -->

    <footer>

        © 2026 Bazaro

    </footer>



    <!-- Firebase -->

    <script>

        const firebaseURL =
            "https://bazaro-4f7d6-default-rtdb.europe-west1.firebasedatabase.app/sections.json";


        fetch(firebaseURL)

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "HTTP " + response.status
                    );

                }

                return response.json();

            })


            .then(function(sections) {

                const status =
                    document.getElementById(
                        "makeup-status"
                    );


                if (
                    sections &&
                    sections.makeup === true
                ) {

                    status.textContent = "ON";

                    status.className =
                        "status on";

                }

                else {

                    status.textContent = "OFF";

                    status.className =
                        "status off";

                }

            })


            .catch(function(error) {

                console.log(
                    "Sections error:",
                    error
                );


                const status =
                    document.getElementById(
                        "makeup-status"
                    );


                status.textContent = "ERROR";

                status.className =
                    "status error";

            });

    </script>


</body>

</html>
