<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إكسسوارات الموبايل - Bazaro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .page-title {
            text-align: center;
            padding: 45px 15px 25px;
        }

        .page-title h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #666;
            font-size: 17px;
        }

        .products {

            max-width: 1100px;

            margin: auto;

            padding: 20px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .product {

            background: white;

            border-radius: 15px;

            padding: 18px;

            text-align: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product-image {

            height: 190px;

            background: #f1f5f9;

            border-radius: 12px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 65px;

            margin-bottom: 15px;
        }

        .product h2 {

            font-size: 20px;

            margin-bottom: 12px;
        }

        .price {

            color: #2563eb;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .store {

            color: #666;

            font-size: 14px;
        }

        .details {

            display: inline-block;

            margin-top: 15px;

            padding: 9px 18px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-size: 14px;
        }

        footer {

            margin-top: 50px;

            background: #222;

            color: white;

            text-align: center;

            padding: 25px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 24px;
            }

            .page-title h1 {
                font-size: 27px;
            }

            .page-title p {
                font-size: 15px;
                line-height: 1.6;
            }

            .products {

                grid-template-columns: repeat(2, 1fr);

                padding: 12px;

                gap: 12px;
            }

            .product {
                padding: 12px;
            }

            .product-image {

                height: 135px;

                font-size: 50px;
            }

            .product h2 {
                font-size: 16px;
            }

            .price {
                font-size: 17px;
            }

            .details {

                width: 100%;

                padding: 8px;
            }
        }

        @media (max-width: 360px) {

            .products {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


    <header>

        <div class="logo">
            Bazaro
        </div>

        <a href="mobiles.html"
           class="back">

            ← الموبايلات

        </a>

    </header>


    <section class="page-title">

        <h1>
            🔌 إكسسوارات الموبايل
        </h1>

        <p>
            إكسسوارات الموبايل المتوفرة للبيع
        </p>

    </section>


    <section class="products">


        <div class="product">

            <div class="product-image">
                🔌
            </div>

            <h2>
                مثال إكسسوار موبايل
            </h2>

            <div class="price">
                السعر سيضاف لاحقًا
            </div>

            <div class="store">
                اسم المتجر
            </div>

            <a href="#"
               class="details">

                عرض التفاصيل

            </a>

        </div>


    </section>


    <footer>

        <p>
            © 2026 Bazaro - جميع الحقوق محفوظة
        </p>

    </footer>


</body>

</html>
