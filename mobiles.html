<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>الموبايلات - Bazaro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        /* الهيدر */

        header {
            background: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        /* العنوان */

        .page-title {
            text-align: center;
            padding: 50px 15px 30px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .page-title p {
            color: #666;
            font-size: 17px;
        }

        /* الأقسام */

        .mobile-sections {

            max-width: 900px;

            margin: auto;

            padding: 20px;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }

        .mobile-section {

            background: white;

            border-radius: 16px;

            padding: 35px 20px;

            text-align: center;

            text-decoration: none;

            color: #222;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

            transition: 0.3s;
        }

        .mobile-section:hover {

            transform: translateY(-5px);

            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        .section-icon {

            font-size: 65px;

            margin-bottom: 20px;
        }

        .mobile-section h2 {

            font-size: 23px;

            margin-bottom: 15px;
        }

        .status {

            display: inline-block;

            padding: 6px 16px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }

        .on {

            background: #dcfce7;

            color: #15803d;
        }

        /* الفوتر */

        footer {

            margin-top: 50px;

            background: #222;

            color: white;

            text-align: center;

            padding: 25px;
        }

        /* الموبايل */

        @media (max-width: 700px) {

            header {

                padding: 15px;
            }

            .logo {

                font-size: 24px;
            }

            .page-title {

                padding: 40px 15px 20px;
            }

            .page-title h1 {

                font-size: 28px;
            }

            .page-title p {

                font-size: 15px;

                line-height: 1.6;
            }

            .mobile-sections {

                grid-template-columns: 1fr;

                padding: 15px;

                gap: 15px;
            }

            .mobile-section {

                padding: 30px 15px;
            }

            .section-icon {

                font-size: 55px;
            }

            .mobile-section h2 {

                font-size: 20px;
            }
        }

    </style>

</head>


<body>


    <!-- الهيدر -->

    <header>

        <div class="logo">
            Bazaro
        </div>

        <a href="index.html"
           class="back">

            ← الرئيسية

        </a>

    </header>


    <!-- العنوان -->

    <section class="page-title">

        <h1>
            📱 قسم الموبايلات
        </h1>

        <p>
            اختر القسم الذي تريد تصفحه
        </p>

    </section>


    <!-- الأقسام -->

    <section class="mobile-sections">


        <!-- أجهزة الموبايل -->

        <a href="mobile-devices.html"
           class="mobile-section">

            <div class="section-icon">
                📱
            </div>

            <h2>
                أجهزة الموبايل
            </h2>

            <span class="status on">
                ON
            </span>

        </a>


        <!-- إكسسوارات الموبايل -->

        <a href="mobile-accessories.html"
           class="mobile-section">

            <div class="section-icon">
                🔌
            </div>

            <h2>
                إكسسوارات الموبايل
            </h2>

            <span class="status on">
                ON
            </span>

        </a>


    </section>


    <!-- الفوتر -->

    <footer>

        <p>
            © 2026 Bazaro - جميع الحقوق محفوظة
        </p>

    </footer>


</body>

</html>
