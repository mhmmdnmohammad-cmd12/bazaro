<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>بدلات رسمية - Bazaro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .page-title {
            text-align: center;
            padding: 50px 15px 30px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .page-title p {
            color: #666;
            font-size: 17px;
        }

        .content {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .women-card {
            background: white;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .women-icon {
            font-size: 75px;
            margin-bottom: 20px;
        }

        .women-card h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .women-card p {
            color: #666;
            line-height: 1.8;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            background: #f3f4f6;
            color: #666;
            font-size: 14px;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 24px;
            }

            .back {
                font-size: 14px;
            }

            .page-title {
                padding: 40px 15px 20px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .page-title p {
                font-size: 15px;
                line-height: 1.6;
            }

            .content {
                padding: 15px;
            }

            .women-card {
                padding: 30px 15px;
            }

            .women-icon {
                font-size: 60px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Bazaro
    </div>

    <a href="women-suits.html"
       class="back">

        ← البدلات النسائية

    </a>

</header>


<section class="page-title">

    <h1>
        👔 بدلات رسمية
    </h1>

    <p>
        منتجات البدلات الرسمية النسائية من متاجر Bazaro
    </p>

</section>


<section class="content">

    <div class="women-card">

        <div class="women-icon">
            👔
        </div>

        <h2>
            قسم البدلات الرسمية النسائية
        </h2>

        <p>
            سيتم عرض منتجات البدلات الرسمية النسائية من المتاجر هنا لاحقًا.
        </p>

        <span class="status">
            قريبًا
        </span>

    </div>

</section>


<footer>

    <p>
        © 2026 Bazaro - جميع الحقوق محفوظة
    </p>

</footer>


</body>

</html>
