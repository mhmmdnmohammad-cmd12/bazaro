<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bazaro - الجوارب النسائية</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #ff4f81;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: #222;
            display: block;
        }

        .product-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .product h2 {
            font-size: 18px;
            margin: 8px 0;
        }

        .status {
            display: inline-block;
            margin-top: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            background: #eee;
            color: #777;
            font-size: 14px;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>🧦 Bazaro</h1>
        <p>الجوارب النسائية</p>
    </header>

    <div class="container">

        <a href="women.html" class="back">
            ⬅ العودة إلى الألبسة النسائية
        </a>

        <div class="products">

            <!-- جوارب نسائية -->
            <a href="women-socks-main.html" class="product">
                <div class="product-icon">🧦</div>
                <h2>جوارب نسائية</h2>
                <span class="status">قريبًا</span>
            </a>

            <!-- جوارب شتوية -->
            <a href="women-winter-socks.html" class="product">
                <div class="product-icon">🧦</div>
                <h2>جوارب شتوية</h2>
                <span class="status">قريبًا</span>
            </a>

            <!-- جوارب رياضية -->
            <a href="women-sports-socks.html" class="product">
                <div class="product-icon">🧦</div>
                <h2>جوارب رياضية</h2>
                <span class="status">قريبًا</span>
            </a>

        </div>

    </div>

    <footer>
        © 2026 Bazaro
    </footer>

</body>

</html>
