<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>الجوارب النسائية - Bazaro</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .page-title {
            text-align: center;
            padding: 50px 15px 30px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .page-title p {
            color: #666;
            font-size: 17px;
        }

        .content {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
        }

        .product {
            background: white;

            border-radius: 16px;

            padding: 30px 20px;

            text-align: center;

            text-decoration: none;

            color: #222;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);

            box-shadow:
                0 5px 15px rgba(0,0,0,0.15);
        }

        .product-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .product h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;

            margin-top: 8px;

            padding: 6px 14px;

            border-radius: 20px;

            background: #f3f4f6;

            color: #666;

            font-size: 14px;
        }

        footer {
            margin-top: 50px;

            background: #222;

            color: white;

            text-align: center;

            padding: 25px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 24px;
            }

            .back {
                font-size: 14px;
            }

            .page-title {
                padding: 40px 15px 20px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .page-title p {
                font-size: 15px;
                line-height: 1.6;
            }

            .content {
                padding: 15px;
            }

            .product {
                padding: 25px 15px;
            }

            .product-icon {
                font-size: 55px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Bazaro
    </div>

    <a href="women.html"
       class="back">

        ← الألبسة النسائية

    </a>

</header>


<section class="page-title">

    <h1>
        🧦 الجوارب النسائية
    </h1>

    <p>
        اختر نوع الجوارب النسائية الذي تريد تصفحه
    </p>

</section>


<section class="content">

    <div class="products">


        <!-- جوارب نسائية -->

        <a href="women-socks-main.html"
           class="product">

            <div class="product-icon">
                🧦
            </div>

            <h2>
                جوارب نسائية
            </h2>

            <span class="status">
                قريبًا
            </span>

        </a>


        <!-- جوارب شتوية -->

        <a href="women-winter-socks.html"
           class="product">

            <div class="product-icon">
                🧦
            </div>

            <h2>
                جوارب شتوية
            </h2>

            <span class="status">
                قريبًا
            </span>

        </a>


        <!-- جوارب رياضية -->

        <a href="women-sports-socks.html"
           class="product">

            <div class="product-icon">
                🧦
            </div>

            <h2>
                جوارب رياضية
            </h2>

            <span class="status">
                قريبًا
            </span>

        </a>


    </div>

</section>


<footer>

    <p>
        © 2026 Bazaro - جميع الحقوق محفوظة
    </p>

</footer>


</body>

</html>
