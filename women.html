<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bazaro - الألبسة النسائية</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* الشريط العلوي */
        .top-nav {
            background: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: ltr;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .top-nav .logo {
            color: #2875d0;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        .top-nav .home {
            color: #2875d0;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        header {
            background: #ff4f81;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .category {
            background: white;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: #222;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: 0.2s;
        }

        .category:hover {
            transform: translateY(-4px);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .category h2 {
            margin: 5px 0;
            font-size: 19px;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <!-- الشريط العلوي مثل باقي أقسام Bazaro -->
    <div class="top-nav">
        <a href="index.html" class="home">الرئيسية ←</a>
        <a href="index.html" class="logo">Bazaro</a>
    </div>

    <!-- رأس قسم الألبسة النسائية - يبقى باللون الوردي -->
    <header>
        <h1>👗 Bazaro</h1>
        <p>قسم الألبسة النسائية</p>
    </header>

    <div class="container">

        <div class="categories">

            <a href="women-dresses.html" class="category">
                <div class="icon">👗</div>
                <h2>الفساتين</h2>
            </a>

            <a href="women-shirts.html" class="category">
                <div class="icon">👚</div>
                <h2>القمصان والبلوزات</h2>
            </a>

            <a href="women-pants.html" class="category">
                <div class="icon">👖</div>
                <h2>البناطيل</h2>
            </a>

            <a href="women-jackets.html" class="category">
                <div class="icon">🧥</div>
                <h2>الجاكيتات والمعاطف</h2>
            </a>

            <a href="women-suits.html" class="category">
                <div class="icon">👔</div>
                <h2>البدلات</h2>
            </a>

            <a href="women-socks.html" class="category">
                <div class="icon">🧦</div>
                <h2>الجوارب</h2>
            </a>

        </div>

    </div>

    <footer>
        © 2026 Bazaro
    </footer>

</body>

</html>
